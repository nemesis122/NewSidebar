name: Render design previews

# Renders every README image with the production WPF renderer on Windows
# (demo hardware, simulated readings) and commits them to Previews/.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Render previews, settings, layout gallery and themes
        shell: pwsh
        run: |
          foreach ($mode in '--release-preview-only','--release-settings-only','--gallery-only') {
            dotnet run --project UITests/LayoutQA.csproj -c Release -- $mode
            if ($LASTEXITCODE -ne 0) { throw "Rendering failed: $mode" }
          }
      - name: Commit images
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Previews/Gallery,Previews/Themes | Out-Null
          Copy-Item Layouts/*-1Column.png,Layouts/*-2Column.png,Layouts/Settings-*.png Previews/ -Force
          Copy-Item Layouts/Gallery/*.png Previews/Gallery/ -Force
          Copy-Item Layouts/Themes/*.png Previews/Themes/ -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Previews
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { 'Previews unchanged'; exit 0 }
          git commit -m 'Previews: render layout gallery, themes and release images'
          git push
